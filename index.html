<style>
  :root {
    --sfondo: #F4F6F9;
    --superficie: #FFFFFF;
    --tenue: #E8EDF4;
    --linea: #DCE2EA;
    --blu: #102C53;          /* Blue Heritage del Politecnico */
    --blu-scuro: #0B2140;
    --azzurro: #4DC9FF;      /* Bright Blue, area Ingegneria */
    --titolo: #102C53;
    --testo: #27374D;
    --grigio: #5E6E83;
    --bordo: clamp(16px, 4vw, 40px);
    --colonna: 1120px;
    --font: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--sfondo); color-scheme: light; -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
  body {
    margin: 0; background: var(--sfondo); color: var(--testo);
    font-family: var(--font); font-size: 1rem; line-height: 1.65;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body:has(dialog[open]) { overflow: hidden; }
  :focus-visible { outline: 2px solid var(--blu); outline-offset: 3px; }
  a { color: inherit; }
  h1, h2, h3 { color: var(--titolo); font-weight: 700; letter-spacing: -.01em; }
  .contenitore { max-width: calc(var(--colonna) + 2 * var(--bordo)); margin-inline: auto; padding-inline: var(--bordo); }

  /* Testata */

  }
  .testa.staccata { border-bottom-color: var(--linea); }
  .testa .contenitore {

  }
  .logo { color: var(--titolo); text-decoration: none; font-weight: 700; font-size: 1.0625rem; margin-right: auto; }
  .nav { display: flex; gap: 24px; }
  .nav button, .menu-voci button { background: none; border: 0; padding: 6px 0; font: inherit; color: var(--grigio); cursor: pointer; }
  .nav button { font-size: .9375rem; font-weight: 600; }
  .nav button:hover { color: var(--titolo); }
  .lingua { display: flex; border: 1px solid var(--linea); border-radius: 999px; padding: 2px; background: var(--superficie); }
  .lingua button {
    background: none; border: 0; border-radius: 999px; padding: 4px 10px; min-width: 40px;
    font: inherit; font-size: .8125rem; font-weight: 700; letter-spacing: .04em; color: var(--grigio); cursor: pointer;

  .hamb { display: none; width: 44px; height: 44px; margin-right: -10px; place-items: center; background: none; border: 0; color: var(--titolo); cursor: pointer; }

  dialog#menu {
    position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none;
    margin: 0; padding: 0; border: 0; background: var(--sfondo); color: var(--titolo);

  .menu-voci button:hover { color: var(--titolo); }

  /* Apertura: testo a sinistra, foto a destra */
  .apertura {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 32px 64px;
    padding-top: clamp(40px, 8vw, 104px); padding-bottom: clamp(48px, 8vw, 96px);

  .apertura.senza-foto { grid-template-columns: minmax(0, 1fr); }
  .apertura h1 { margin: 0; font-size: clamp(2.4rem, 6.4vw, 4.5rem); line-height: 1.02; letter-spacing: -.03em; }

  .ritratto { position: relative; width: clamp(220px, 26vw, 320px); }
  /* il cerchio richiama la forma base dell'identità del Politecnico */
  .ritratto::before {

    .ritratto img { border-radius: 12px; }

  .azioni { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 18px;
    border: 1px solid var(--linea); border-radius: 999px; text-decoration: none; background: var(--superficie);
    color: var(--titolo); font-weight: 600; font-size: .9375rem; transition: border-color .15s ease, background-color .15s ease;
  }
  .btn:hover { border-color: var(--blu); }
  .btn.primario { background: var(--blu); color: #fff; border-color: var(--blu); }
  .btn.primario:hover { background: var(--blu-scuro); border-color: var(--blu-scuro); }
  .btn svg { width: 16px; height: 16px; }

  /* Sezioni */
  section.blocco { padding-top: clamp(48px, 7vw, 88px); }
  .blocco > h2 { margin: 0 0 28px; font-size: clamp(1.5rem, 3vw, 2rem); }

  /* Progetti */
  .progetti { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px; }
  .scheda {
    display: flex; flex-direction: column; text-decoration: none; color: inherit;
    border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; background: var(--superficie);

  .copertina img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .copertina .numero {
    position: absolute; left: 18px; bottom: 8px; font-size: 4.5rem; font-weight: 700; line-height: 1;

  }
  .scheda-corpo { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .scheda h3 { margin: 0; font-size: 1.125rem; line-height: 1.3; }
  .contesto { margin: 0; font-size: .8125rem; color: var(--grigio); }
  .scheda p.sintesi { margin: 2px 0 0; font-size: .9375rem; }
  .etichette { display: flex; flex-wrap: wrap; gap: 6px; margin: auto 0 0; padding: 10px 0 0; list-style: none; }
  .etichette li { font-size: .75rem; font-weight: 500; padding: 3px 9px; border: 1px solid var(--linea); border-radius: 999px; color: var(--testo); background: var(--sfondo); }
  .stato { align-self: flex-start; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--azzurro); color: var(--blu); }

  /* Competenze, formazione, lingue */
  .gruppi { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 28px 32px; }
  .gruppi h3 { margin: 0 0 10px; font-size: .9375rem; }
  .gruppi ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .9375rem; }
  .elenco { display: grid; gap: 24px; margin: 0; }
  .voce { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 4px 24px; padding-top: 24px; border-top: 1px solid var(--linea); }
  .voce:first-child { border-top: 0; padding-top: 0; }
  .voce .quando { color: var(--grigio); font-size: .875rem; font-variant-numeric: tabular-nums; }
  .voce h3 { margin: 0; font-size: 1.0625rem; }
  .voce p { margin: 2px 0 0; font-size: .9375rem; }
  @media (max-width: 640px) { .voce { grid-template-columns: 1fr; } }
  .chi p { max-width: 68ch; margin: 0 0 1em; }

  .contatti { display: grid; gap: 22px; margin: 0; }
  .contatti dt { font-size: .8125rem; color: var(--grigio); }
  .contatti dd { margin: 2px 0 0; font-size: clamp(1.05rem, 2.2vw, 1.3rem); font-weight: 600; overflow-wrap: anywhere; }
  .contatti a { color: var(--blu); text-decoration: none; border-bottom: 1px solid rgba(16, 44, 83, .3); }
  .contatti a:hover { border-bottom-color: var(--blu); }
  .piede { padding-top: clamp(64px, 9vw, 112px); padding-bottom: 28px; font-size: .8125rem; color: var(--grigio); display: flex; flex-wrap: wrap; gap: 8px 24px; }
  .piede button { background: none; border: 0; padding: 0; font: inherit; color: var(--grigio); text-decoration: underline; cursor: pointer; }

  /* Pagina di un progetto */
  .dettaglio { padding-top: clamp(24px, 4vw, 48px); }
  .indietro { display: inline-flex; align-items: center; gap: 6px; color: var(--grigio); text-decoration: none; font-size: .9375rem; font-weight: 600; }
  .indietro:hover { color: var(--titolo); }

  /* Testa del progetto: testo a sinistra, immagine principale a destra */
  .p-testa {
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px 56px; align-items: center;

  .figura { margin: 0; }
  .figura a { display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--linea); background: var(--tenue); cursor: zoom-in; }

  .p-ruolo {

  .p-risultati {

  /* Struttura semplice, per i progetti senza sezioni */
  .p-testo { max-width: 72ch; }
  .p-testo h2 { font-size: 1.125rem; margin: 36px 0 8px; }

  .dettaglio > h2.p-sezione-titolo + .video { margin-top: 16px; }
  .galleria { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 24px 16px; margin-top: 16px; }

  /* Scelta della lingua al primo accesso */

  .scelta-box { text-align: center; padding: 24px; }
  .scelta-box img { width: 72px; height: 72px; display: block; margin: 0 auto 28px; border-radius: 12px; }
  .scelta-box img.tonda { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; box-shadow: 0 0 0 6px var(--superficie), 0 0 0 7px var(--linea); }
  .scelta-box p { margin: 0 0 4px; color: var(--grigio); }
  .scelta-box .scelta-btn { display: flex; gap: 12px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
  .scelta-box button {
    min-width: 150px; min-height: 52px; border-radius: 999px; border: 1px solid var(--linea); background: var(--superficie);
    color: var(--titolo); font: inherit; font-weight: 600; font-size: 1.0625rem; cursor: pointer;
  }
  .scelta-box button:hover { border-color: var(--blu); }

  /* Consenso alle statistiche */
  .consenso {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%);
    width: min(640px, calc(100% - 24px)); z-index: 20;
    background: var(--superficie); border: 1px solid var(--linea); border-radius: 12px; padding: 16px 18px;
    box-shadow: 0 18px 40px -20px rgba(16, 44, 83, .45);
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; font-size: .875rem;
  }
  .consenso p { margin: 0; flex: 1 1 280px; }
  .consenso .azioni-consenso { display: flex; gap: 8px; }
  .consenso button {
    min-height: 40px; padding: 8px 16px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid var(--linea); background: var(--superficie); color: var(--titolo);
  }
  .consenso button.si { background: var(--blu); color: #fff; border-color: var(--blu); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="testa" id="testa">
  <div class="contenitore">
    <a class="logo" id="logo" href="#"></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="lingua" id="lingua" role="group" aria-label="Language">
      <button type="button" data-l="it" aria-pressed="false">IT</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
    <button class="hamb" id="apri-menu" type="button" aria-controls="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6.5h18M3 12h18M3 17.5h18"/></svg>
    </button>
  </div>
</header>

<dialog id="menu">
  <div class="menu-testa">
    <button class="hamb" id="chiudi-menu" type="button" style="display:grid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <nav class="menu-voci" id="menu-voci"></nav>
</dialog>

<main id="pagina"></main>

<div class="contenitore"><footer class="piede" id="piede"></footer></div>

<dialog id="scelta" aria-label="Lingua / Language">
  <div class="scelta-box">
    <img id="scelta-img" src="favicon.png" alt="">
    <p>Scegli la lingua</p>
    <p>Choose your language</p>
    <div class="scelta-btn">
      <button type="button" data-l="it">Italiano</button>
      <button type="button" data-l="en">English</button>
    </div>
  </div>
</dialog>

<div class="consenso" id="consenso" hidden>
  <p id="consenso-testo"></p>
  <div class="azioni-consenso">
    <button type="button" id="consenso-no"></button>
    <button type="button" class="si" id="consenso-si"></button>
  </div>
</div>

<script>
/* ========== Da qui in giù non serve toccare niente ========== */

const T = {
  progetti:   { it: "Progetti", en: "Projects" },
  competenze: { it: "Competenze", en: "Skills" },
  formazione: { it: "Formazione", en: "Education" },
  chi:        { it: "Chi sono", en: "About" },
  contatti:   { it: "Contatti", en: "Contact" },
  lingue:     { it: "Lingue", en: "Languages" },
  scaricaCV:  { it: "Scarica il CV", en: "Download CV" },
  indietro:   { it: "Tutti i progetti", en: "All projects" },
  panoramica: { it: "Panoramica", en: "Overview" },
  problema:   { it: "Il problema", en: "The problem" },
  contributo: { it: "Il mio contributo", en: "My contribution" },
  approfondimento: { it: "Approfondimento tecnico", en: "Technical deep dive" },
  risultati:  { it: "Risultati", en: "Results" },
  strumenti:  { it: "Strumenti", en: "Tools" },
  immagini:   { it: "Immagini", en: "Images" },
  video:      { it: "Video", en: "Video" },
  foto:       { it: "Le mie fotografie", en: "My photography" },
  telefono:   { it: "Telefono", en: "Phone" },
  apriMenu:   { it: "Apri menu", en: "Open menu" },
  chiudiMenu: { it: "Chiudi menu", en: "Close menu" },
  nonTrovato: { it: "Progetto non trovato.", en: "Project not found." },
  privacy:    { it: "Preferenze statistiche", en: "Analytics preferences" },
  consenso: {
    it: "Uso Google Analytics per sapere in forma anonima da quali paesi viene visitato il sito. Lo attivo solo se accetti.",
    en: "I use Google Analytics to see, anonymously, which countries visitors come from. It only runs if you accept.",
  },
  accetta:    { it: "Accetta", en: "Accept" },
  rifiuta:    { it: "No, grazie", en: "No, thanks" },
};

const $ = (id) => document.getElementById(id);
const el = (tag, cls, testo) => { const e = document.createElement(tag); if (cls) e.className = cls; if (testo != null) e.textContent = testo; return e; };
const memoria = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

/* Lingua: ?lang=it|en nell'indirizzo, poi la scelta salvata, altrimenti si chiede */
let lingua = null;
const daIndirizzo = new URLSearchParams(location.search).get("lang");
if (daIndirizzo === "it" || daIndirizzo === "en") { lingua = daIndirizzo; memoria.set("lingua", lingua); }
else if (memoria.get("lingua") === "it" || memoria.get("lingua") === "en") lingua = memoria.get("lingua");
const primaVisita = !lingua;
if (primaVisita) lingua = (navigator.language || "").toLowerCase().startsWith("it") ? "it" : "en";

const t = (v) => {
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[lingua] || v.en || v.it || "";
};

function impostaLingua(l, salva = true) {
  lingua = l; if (salva) memoria.set("lingua", l);
  document.documentElement.lang = l;
  document.querySelectorAll("#lingua button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
  costruisciNav();
  mostra(true);
  aggiornaConsenso();
}

/* Navigazione */
const SEZIONI = ["progetti", "competenze", "formazione", "chi", "contatti"];
function costruisciNav() {
  $("logo").textContent = SITO.nome;
  const nav = $("nav"), voci = $("menu-voci");
  nav.replaceChildren(); voci.replaceChildren();
  SEZIONI.forEach(id => {
    [nav, voci].forEach(box => {
      const b = el("button", null, t(T[id])); b.type = "button";
      b.addEventListener("click", () => vaiA(id));
      box.append(b);
    });
  });
  $("apri-menu").setAttribute("aria-label", t(T.apriMenu));
  $("chiudi-menu").setAttribute("aria-label", t(T.chiudiMenu));
}
function vaiA(id) {
  if (menu.open) menu.close();
  const scorri = () => { const s = $(id); if (s) s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); };
  if (location.hash.startsWith("#/")) { history.pushState(null, "", location.pathname + location.search); mostra(); requestAnimationFrame(scorri); }
  else scorri();
}
const menu = $("menu");
$("apri-menu").addEventListener("click", () => { menu.showModal(); $("apri-menu").setAttribute("aria-expanded", "true"); });
$("chiudi-menu").addEventListener("click", () => menu.close());
menu.addEventListener("close", () => $("apri-menu").setAttribute("aria-expanded", "false"));
$("logo").addEventListener("click", (e) => { e.preventDefault(); history.pushState(null, "", location.pathname + location.search); mostra(); scrollTo(0, 0); });
document.querySelectorAll("#lingua button").forEach(b => b.addEventListener("click", () => impostaLingua(b.dataset.l)));
addEventListener("scroll", () => $("testa").classList.toggle("staccata", scrollY > 8), { passive: true });

/* Icone */
const ICONE = {
  scarica: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>',
  freccia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  indietro: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
};
function bottone(testo, href, primario, icona, esterno) {
  const a = el("a", "btn" + (primario ? " primario" : ""));
  a.href = href; a.innerHTML = ICONE[icona] || ""; a.append(document.createTextNode(testo));
  if (esterno) { a.target = "_blank"; a.rel = "noopener"; }
  return a;
}

/* Pagine */
let ultimaRotta = null;
function mostra(forza) {
  if (!lingua) return;
  const rottaAttuale = location.hash.startsWith("#/") ? location.hash : "";
  if (!forza && rottaAttuale === ultimaRotta) return;
  ultimaRotta = rottaAttuale;
  const box = $("pagina");
  box.replaceChildren();
  const rotta = location.hash.match(/^#\/p\/(.+)$/);
  if (rotta) paginaProgetto(box, decodeURIComponent(rotta[1]));
  else paginaPrincipale(box);
  piede();
  traccia();
}
addEventListener("hashchange", () => { const prima = ultimaRotta; mostra(); if (ultimaRotta !== prima) scrollTo(0, 0); });
addEventListener("popstate", () => mostra());

function paginaPrincipale(box) {
  document.title = `${SITO.nome} | Electronics Engineering`;
  const c = el("div", "contenitore");

  const ap = el("section", "apertura");
  const testoAp = el("div", "apertura-testo");
  testoAp.append(el("h1", null, SITO.nome), el("p", "ruolo", t(PROFILO.ruolo)));
  if (t(PROFILO.intro)) testoAp.append(el("p", "intro", t(PROFILO.intro)));
  const az = el("div", "azioni");
  if (t(SITO.cv)) az.append(bottone(t(T.scaricaCV), t(SITO.cv), true, "scarica"));
  if (SITO.linkedin) az.append(bottone("LinkedIn", SITO.linkedin, false, "freccia", true));
  if (SITO.github) az.append(bottone("GitHub", SITO.github, false, "freccia", true));
  if (SITO.email) az.append(bottone("Email", `mailto:${SITO.email}`, false));
  testoAp.append(az);
  ap.append(testoAp);
  if (SITO.foto) {
    const cornice = el("div", "ritratto");
    const img = el("img"); img.src = SITO.foto; img.alt = SITO.nome; img.decoding = "async";
    img.addEventListener("error", () => { cornice.remove(); ap.classList.add("senza-foto"); });
    cornice.append(img); ap.append(cornice);
  } else ap.classList.add("senza-foto");
  c.append(ap);

  // Progetti
  const sp = blocco("progetti");
  const griglia = el("div", "progetti");
  PROGETTI.forEach((p, i) => griglia.append(scheda(p, i)));
  sp.append(griglia);
  c.append(sp);

  // Competenze
  const sc = blocco("competenze");
  const gr = el("div", "gruppi");
  COMPETENZE.forEach(g => {
    const d = el("div"); d.append(el("h3", null, t(g.gruppo)));
    const ul = el("ul"); g.voci.forEach(v => ul.append(el("li", null, t(v))));
    d.append(ul); gr.append(d);
  });
  sc.append(gr);
  c.append(sc);

  // Formazione e lingue
  const sf = blocco("formazione");
  const lista = el("div", "elenco");
  FORMAZIONE.forEach(f => {
    const v = el("div", "voce");
    v.append(el("div", "quando", t(f.periodo)));
    const d = el("div"); d.append(el("h3", null, t(f.titolo)), el("p", null, f.ente));
    if (t(f.nota)) d.append(el("p", "contesto", t(f.nota)));
    v.append(d); lista.append(v);
  });
  const vl = el("div", "voce");
  vl.append(el("div", "quando", t(T.lingue)));
  const dl = el("div");
  LINGUE.forEach(l => { const p = el("p"); const s = el("strong", null, t(l.lingua)); s.style.color = "var(--titolo)"; s.style.fontWeight = "600"; p.append(s, document.createTextNode(`: ${t(l.livello)}`)); dl.append(p); });
  vl.append(dl); lista.append(vl);
  sf.append(lista);
  c.append(sf);

  // Chi sono
  const sa = blocco("chi");
  sa.classList.add("chi");
  sa.append(el("p", null, t(PROFILO.chiSono)));
  if (SITO.fotografia) { const az2 = el("div", "azioni"); az2.append(bottone(t(T.foto), SITO.fotografia, false, "freccia", true)); sa.append(az2); }
  c.append(sa);

  // Contatti
  const sk = blocco("contatti");
  const d = el("dl", "contatti");
  const riga = (et, testo, href, est) => {
    const w = el("div"); const a = el("a", null, testo); a.href = href;
    if (est) { a.target = "_blank"; a.rel = "noopener"; }
    const dd = el("dd"); dd.append(a); w.append(el("dt", null, et), dd); d.append(w);
  };
  if (SITO.email) riga("Email", SITO.email, `mailto:${SITO.email}`);
  if (SITO.linkedin) riga("LinkedIn", SITO.linkedin.replace(/^https?:\/\/(www\.)?/, ""), SITO.linkedin, true);
  if (SITO.github) riga("GitHub", SITO.github.replace(/^https?:\/\//, ""), SITO.github, true);
  if (SITO.telefono) riga(t(T.telefono), SITO.telefono, `tel:${SITO.telefono.replace(/[^\d+]/g, "")}`);
  sk.append(d);
  c.append(sk);

  box.append(c);
}

function blocco(id) {
  const s = el("section", "blocco"); s.id = id;
  s.setAttribute("aria-labelledby", id + "-titolo");
  const h = el("h2", null, t(T[id])); h.id = id + "-titolo";
  s.append(h);
  return s;
}

function scheda(p, i) {
  const a = el("a", "scheda"); a.href = `#/p/${encodeURIComponent(p.id)}`;
  const cop = el("div", "copertina");
  const cop0 = immagineCopertina(p);
  if (cop0) {
    const img = el("img"); img.src = t(cop0.file); img.alt = ""; img.loading = "lazy"; img.decoding = "async";
    img.addEventListener("error", () => img.remove());
    cop.append(img);
  }
  else cop.append(el("span", "numero", String(i + 1).padStart(2, "0")));
  const corpo = el("div", "scheda-corpo");
  if (t(p.stato)) corpo.append(el("span", "stato", t(p.stato)));
  corpo.append(el("h3", null, t(p.titolo)), el("p", "contesto", t(p.contesto)), el("p", "sintesi", t(p.sintesi)));
  if (p.strumenti && p.strumenti.length) {
    const ul = el("ul", "etichette");
    p.strumenti.slice(0, 5).forEach(s => ul.append(el("li", null, t(s))));
    corpo.append(ul);
  }
  a.append(cop, corpo);
  return a;
}

function paginaProgetto(box, id) {
  const p = PROGETTI.find(x => x.id === id);
  const c = el("article", "contenitore dettaglio");
  const back = el("a", "indietro"); back.href = "#progetti";
  back.innerHTML = ICONE.indietro; back.append(document.createTextNode(t(T.indietro)));
  back.addEventListener("click", (e) => { e.preventDefault(); vaiA("progetti"); });
  c.append(back);
  if (!p) { c.append(el("p", null, t(T.nonTrovato))); box.append(c); return; }
  document.title = `${t(p.titolo)} | ${SITO.nome}`;

  const immagini = elencoImmagini(p);
  const copertina = immagineCopertina(p);

  // Testa: contesto, titolo, introduzione, etichette e immagine principale
  const testa = el("header", "p-testa");
  const sx = el("div");
  sx.append(el("p", "p-contesto", t(p.contesto)), el("h1", null, t(p.titolo)));
  if (t(p.stato)) sx.append(el("span", "stato", t(p.stato)));
  const intro = t(p.intro) || (p.sezioni ? "" : t(p.descrizione));
  if (intro) paragrafi(intro).forEach(par => sx.append(el("p", "p-intro", par)));
  if (p.strumenti && p.strumenti.length) {
    const ul = el("ul", "etichette");
    p.strumenti.forEach(s => ul.append(el("li", null, t(s))));
    sx.append(ul);
  }
  testa.append(sx);
  if (copertina) testa.append(figura(copertina, t(p.titolo), true, () => testa.classList.add("senza-immagine")));
  else testa.classList.add("senza-immagine");
  c.append(testa);

  // Il mio contributo
  const ruolo = t(p.ruolo) || t(p.contributo);
  if (ruolo) {
    const r = el("section", "p-ruolo");
    r.append(el("span", "p-etichetta", t(T.contributo)));
    paragrafi(ruolo).forEach(par => r.append(el("p", null, par)));
    c.append(r);
  }

  // Problema (se scritto a parte)
  if (t(p.problema)) {
    const pt = el("div", "p-testo");
    pt.append(el("h2", null, t(T.problema)));
    paragrafi(t(p.problema)).forEach(par => pt.append(el("p", null, par)));
    c.append(pt);
  }

  // Approfondimento: le sezioni, ognuna con la sua immagine
  if (p.sezioni && p.sezioni.length) {
    c.append(el("h2", "p-sezione-titolo", t(T.approfondimento)));
    const passi = el("div", "passi");
    p.sezioni.forEach((s, i) => {
      const riga = el("section", "passo");
      const testo = el("div");
      const h = el("h3");
      h.append(el("span", "numero-passo", String(i + 1).padStart(2, "0")), document.createTextNode(t(s.titolo)));
      testo.append(h);
      paragrafi(t(s.testo)).forEach(par => testo.append(el("p", null, par)));
      riga.append(testo);
      if (s.immagine) riga.append(figura(normalizza(s.immagine), t(s.titolo)));
      else riga.style.gridTemplateColumns = "minmax(0, 1fr)";
      passi.append(riga);
    });
    c.append(passi);
  }

  // Risultati
  if (t(p.risultati)) {
    const r = el("section", "p-risultati");
    r.append(el("span", "p-etichetta", t(T.risultati)));
    paragrafi(t(p.risultati)).forEach(par => r.append(el("p", null, par)));
    c.append(r);
  }

  // Video
  const indirizzoVideo = incorporaVideo(p.video);
  if (indirizzoVideo) {
    c.append(el("h2", "p-sezione-titolo", t(T.video)));
    const v = el("div", "video");
    const f = el("iframe");
    f.src = indirizzoVideo; f.title = `${t(p.titolo)}, video`; f.loading = "lazy";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
    v.append(f); c.append(v);
  }

  // Altre immagini, se ce ne sono oltre alla copertina
  const altre = immagini.filter(x => !copertina || x.file !== copertina.file);
  if (altre.length) {
    c.append(el("h2", "p-sezione-titolo", t(T.immagini)));
    const g = el("div", "galleria");
    altre.forEach(x => g.append(figura(x, t(p.titolo))));
    c.append(g);
  }

  if (p.link && p.link.length) {
    const lk = el("div", "collegamenti");
    p.link.forEach(l => lk.append(bottone(t(l.testo), l.url, false, "freccia", true)));
    c.append(lk);
  }
  box.append(c);
}

function paragrafi(testo) { return String(testo).split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); }
function normalizza(x) { return typeof x === "string" ? { file: x } : x; }
function elencoImmagini(p) { return (p.immagini || []).map(normalizza); }
function immagineCopertina(p) { return p.copertina ? normalizza(p.copertina) : elencoImmagini(p)[0] || null; }
function figura(x, alt, subito, seErrore) {
  const fig = el("figure", "figura");
  const src = t(x.file);
  const a = el("a"); a.href = src; a.target = "_blank"; a.rel = "noopener";
  const img = el("img"); img.src = src; img.alt = t(x.testo) || alt || "";
  img.loading = subito ? "eager" : "lazy"; img.decoding = "async";
  img.addEventListener("error", () => { fig.remove(); if (seErrore) seErrore(); });
  a.append(img); fig.append(a);
  if (t(x.testo)) fig.append(el("figcaption", null, t(x.testo)));
  return fig;
}

function incorporaVideo(u) {
  if (!u) return "";
  let m = u.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = u.match(/drive\.google\.com\/.*[?&]id=([^&#]+)/);
  if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return `https://www.youtube-nocookie.com/embed/${m[1]}`;
  return "";
}

function piede() {
  const f = $("piede"); f.replaceChildren();
  f.append(el("span", null, `© ${new Date().getFullYear()} ${SITO.nome}`));
  if (SITO.googleAnalytics) {
    const b = el("button", null, t(T.privacy)); b.type = "button";
    b.addEventListener("click", () => { memoria.set("statistiche", ""); aggiornaConsenso(true); });
    f.append(b);
  }
}

/* Google Analytics: si carica solo dopo il consenso */
let gaAttivo = false;
function aggiornaConsenso(forza) {
  const box = $("consenso");
  if (!SITO.googleAnalytics || !lingua || $("scelta").open) { box.hidden = true; return; }
  $("consenso-testo").textContent = t(T.consenso);
  $("consenso-si").textContent = t(T.accetta);
  $("consenso-no").textContent = t(T.rifiuta);
  const scelta = memoria.get("statistiche");
  if (scelta === "si") { box.hidden = true; avviaGA(); return; }
  box.hidden = scelta === "no" && !forza ? true : !(forza || !scelta);
}
$("consenso-si").addEventListener("click", () => { memoria.set("statistiche", "si"); $("consenso").hidden = true; avviaGA(); });
$("consenso-no").addEventListener("click", () => { memoria.set("statistiche", "no"); $("consenso").hidden = true; });

function avviaGA() {
  if (gaAttivo || !SITO.googleAnalytics) return;
  gaAttivo = true;
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag("js", new Date());
  gtag("config", SITO.googleAnalytics, { send_page_view: false });
  const s = document.createElement("script");
  s.async = true; s.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(SITO.googleAnalytics)}`;
  document.head.append(s);
  traccia();
}
function traccia() {
  if (!gaAttivo || !window.gtag) return;
  gtag("event", "page_view", { page_location: location.href, page_title: document.title, language: lingua });
}

/* Avvio */
const scelta = $("scelta");
// nel cerchio iniziale uso la versione quadrata; se manca, la foto normale
[SITO.fotoQuadrata, SITO.foto].filter(Boolean).reduceRight((dopo, file) => () => {
  const prova = new Image();
  prova.onload = () => { $("scelta-img").src = file; $("scelta-img").classList.add("tonda"); };
  prova.onerror = dopo;
  prova.src = file;
}, () => {})();
scelta.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { scelta.close(); impostaLingua(b.dataset.l); }));
scelta.addEventListener("cancel", (e) => e.preventDefault());
impostaLingua(lingua, !primaVisita);
if (primaVisita) { $("consenso").hidden = true; scelta.showModal(); }
</script>
